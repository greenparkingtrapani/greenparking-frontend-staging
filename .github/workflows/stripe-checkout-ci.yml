name: Stripe Checkout frontend CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [fix/stripe-checkout-safe-20261029, feat/reservation-content-editor-20261029, feat/vehicle-sizes-ebike-20261029]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
